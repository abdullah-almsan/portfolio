<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدورات والتدريب</title>
<link rel="stylesheet" href="resources/shared-theme.css">
<style>
:root{--bg:#09090b;--card:#111113;--surface-2:#18181b;--accent:#8b5cf6;--accent-2:#a78bfa;--text:#f4f4f5;--muted:#a1a1aa;--faint:#71717a;--line:#29292f}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Tahoma,sans-serif;line-height:1.55}button,a{font:inherit}.shell{max-width:1320px;margin:auto;padding:0 22px}a{color:var(--accent-2);text-decoration:none;font-weight:700}
header.site-top{padding:14px 0;border-bottom:1px solid var(--line);background:rgba(9,9,11,.88);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}header.site-top .shell{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.top-actions{display:flex;gap:8px;align-items:center}.top-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:700}
.hero{padding:34px 0 12px}.eyebrow{color:var(--accent-2);letter-spacing:.1em;text-transform:uppercase;font-size:12px;font-weight:700}h1{font-size:clamp(28px,4vw,44px);margin:7px 0 7px;line-height:1.1;letter-spacing:-.025em}.hero-count{margin:0;color:var(--muted);font-size:14px;font-weight:700}.classification-note{margin:14px 0 18px;border-inline-start:2px solid var(--accent);background:rgba(139,92,246,.06);padding:10px 12px;color:var(--muted);font-size:13px;line-height:1.6}
.pro-certs[hidden]{display:none}.pro-certs{margin:0 0 20px}.pro-certs-title{margin:0 0 9px;font-size:15px}.pro-certs-list{display:grid;gap:8px}.pro-cert-row{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:9px}.pro-cert-row img{width:58px;height:46px;object-fit:contain;border-radius:7px;background:#0c0c0f}.pro-cert-row strong,.pro-cert-row span,.pro-cert-row small{display:block}.pro-cert-row span,.pro-cert-row small{color:var(--muted);font-size:12px}.pro-cert-verify{display:inline!important}
.filters-panel{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0 8px;margin-bottom:20px}.filter-group{padding:0 0 12px}.filter-label{display:block;margin:0 0 7px;color:var(--faint);font-size:12px;font-weight:700}.filters{display:flex;flex-wrap:wrap;gap:7px}.filter{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 10px;border-radius:999px;cursor:pointer;font-weight:650;font-size:12px}.filter:hover{border-color:rgba(139,92,246,.32);color:var(--text)}.filter.active{background:rgba(139,92,246,.11);color:var(--accent-2);border-color:rgba(139,92,246,.46)}.subfilters[hidden]{display:none}#issuerFilters .filter{max-width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:normal;line-height:1.3;direction:ltr;text-align:left;overflow-wrap:normal}#issuerFilters .filter[data-issuer="all"]{direction:rtl;text-align:center}#issuerFilters .filter-name{min-width:0;direction:ltr;unicode-bidi:isolate;text-align:left;overflow-wrap:normal;word-break:normal}#issuerFilters .filter[data-issuer="all"] .filter-name{direction:rtl;text-align:center}#issuerFilters .filter-count{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:26px;height:26px;padding:0 7px;border:1px solid rgba(139,92,246,.28);border-radius:999px;background:rgba(139,92,246,.08);color:var(--accent-2);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px;font-weight:800}
.groups{padding-bottom:42px}.field-group{margin:0 0 26px}.field-group h2{font-size:18px;margin:0 0 11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{min-width:0;min-height:286px;background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}.thumb{height:132px;flex:0 0 132px;display:flex;align-items:center;justify-content:center;background:#0c0c0f;padding:10px;border-bottom:1px solid var(--line)}.thumb img{width:100%;height:100%;object-fit:contain;border-radius:7px}.thumb.missing{display:none}.meta{min-height:0;padding:12px 13px 13px;display:flex;flex:1;flex-direction:column;gap:5px}.meta h3{font-size:14px;line-height:1.38;margin:0;white-space:normal;overflow:visible;display:block;min-height:2.76em}.issuer{font-size:11.5px;line-height:1.4;margin:0;color:var(--muted);font-weight:700;white-space:normal}.partner{font-size:10.5px;line-height:1.35;margin:0;color:var(--faint);font-weight:600}.details{font-size:11px;color:var(--faint);min-height:15px}.note{align-self:flex-start;border:1px solid rgba(139,92,246,.25);background:rgba(139,92,246,.07);color:var(--accent-2);border-radius:999px;padding:2px 6px;font-size:10px;line-height:1.35}.open-cert{align-self:flex-start;margin-top:auto;border:0;background:none;color:var(--accent-2);font-weight:700;cursor:pointer;padding:4px 0 0;font-size:11.5px}
.empty{color:var(--muted);padding:24px 0}
.cert-lightbox{position:fixed;inset:0;background:rgba(3,3,5,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:99;backdrop-filter:blur(8px)}.cert-lightbox.open{display:flex}.cert-lightbox-inner{width:min(1100px,96vw);height:min(88vh,900px);background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative}.cert-preview-scroll{width:100%;height:100%;overflow:auto;display:block;padding:44px 10px 10px;direction:ltr}.cert-lightbox img{display:block;width:auto;height:auto;max-width:none;max-height:none;object-fit:contain;margin-inline:auto}.cert-zoom{position:absolute;top:12px;inset-inline-start:12px;z-index:3;display:flex;gap:6px}.cert-zoom button,.cert-close{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:700}.cert-zoom button{min-width:38px;height:36px}.cert-close{position:absolute;top:12px;inset-inline-end:12px;width:40px;height:36px;z-index:3}
@media(max-width:1199px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:899px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:599px){.shell{padding-inline:14px}.grid{grid-template-columns:1fr}.hero{padding-top:28px}.card{min-height:0}}
@media(pointer:coarse){.open-cert{display:inline-flex;align-items:center;min-height:44px;padding-block:10px}.cert-zoom button,.cert-close{min-width:44px;min-height:44px;height:44px}.cert-close{width:44px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.cert-type{display:inline-flex;align-items:center;align-self:flex-start;width:max-content;max-width:100%;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10px;line-height:1.35;font-weight:800}.cert-type--credential{color:#ddd6fe;border-color:rgba(139,92,246,.48);background:rgba(139,92,246,.13)}.cert-type--training{color:#bfdbfe;border-color:rgba(96,165,250,.34);background:rgba(59,130,246,.09)}.cert-type--attendance{color:#d1fae5;border-color:rgba(52,211,153,.30);background:rgba(16,185,129,.08)}.additional-courses{margin:8px 0 28px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.015);overflow:hidden}.additional-courses summary{cursor:pointer;min-height:48px;display:flex;align-items:center;padding:12px 14px;font-weight:800;color:var(--text)}.additional-courses[open] summary{border-bottom:1px solid var(--line)}.additional-courses .grid{padding:14px}.additional-courses-note{margin:0;padding:0 14px 14px;color:var(--muted);font-size:12px}.merged-course-row{margin:14px;border:1px solid var(--line);border-radius:13px;padding:13px;display:grid;grid-template-columns:minmax(190px,.8fr) minmax(0,1.8fr);gap:14px;align-items:center;background:var(--card)}.merged-course-row h3{margin:0 0 7px;font-size:14px}.merged-cert-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.merged-cert-button{min-height:54px;text-align:start;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--text);padding:8px 10px;cursor:pointer}.merged-cert-button strong,.merged-cert-button span{display:block}.merged-cert-button span{font-size:11px;color:var(--muted);margin-top:2px}@media(max-width:599px){.merged-course-row{grid-template-columns:1fr}.merged-cert-actions{grid-template-columns:1fr}.merged-cert-button span{font-size:12px}}

<style id="issuer-mobile-layout-fix">
@media(max-width:599px){
  #issuerFilters{align-items:stretch}
  #issuerFilters .filter{min-height:44px}
  #issuerFilters .filter-name{max-width:min(250px,calc(100vw - 118px));line-height:1.25}
}
</style>
</style>
<script src="resources/shared-bidi.js" defer></script>
<script src="assets/data/certificates-data.js"></script>
<link rel="icon" type="image/svg+xml" href="assets/ui/logo.svg">
<style id="mobile-accessibility-fix">
@media(max-width:1024px){
  .top-btn,.filter,.open-cert,.merged-cert-button,.cert-zoom button,.cert-close{min-height:44px}
  .top-btn,.filter{display:inline-flex;align-items:center;justify-content:center}
  .issuer,.partner,.details,.note,.open-cert,.cert-type,.merged-cert-button span{font-size:12px}
}
</style>
</head>
<body data-scroll-root>
<header class="site-top"><div class="shell"><button class="top-btn" id="pageBack" type="button"></button><div class="top-actions"><button class="top-btn" id="langBtn" type="button"></button></div></div></header>
<main class="shell">
<section class="hero" aria-labelledby="heroTitle"><div class="eyebrow" id="heroEyebrow"></div><h1 id="heroTitle"></h1><p class="hero-count" id="heroCount"></p><p class="classification-note" id="classificationNote"></p></section>
<div class="pro-certs" id="proCerts" hidden></div>
<section class="filters-panel" aria-label="Filters">
  <div class="filter-group"><span class="filter-label" id="fieldFilterLabel"></span><div class="filters" id="fieldFilters"></div></div>
  <div class="filter-group subfilters" id="subFilterGroup" hidden><span class="filter-label" id="subFilterLabel"></span><div class="filters" id="subFilters"></div></div>
  <div class="filter-group"><span class="filter-label" id="issuerFilterLabel"></span><div class="filters" id="issuerFilters"></div></div>
</section>
<section class="groups" id="groups"></section>
</main>
<div class="cert-lightbox" id="certLightbox" aria-hidden="true"><div class="cert-lightbox-inner" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle"><div class="cert-zoom"><button id="zoomOut" type="button" aria-label="Zoom out">−</button><button id="zoomReset" type="button" aria-label="Reset zoom">Fit</button><button id="zoomIn" type="button" aria-label="Zoom in">+</button></div><button class="cert-close" id="certClose" type="button" aria-label="Close">×</button><div class="cert-preview-scroll"><img id="preview" alt=""></div><span id="lightboxTitle" hidden></span></div></div>
<script>
(function(){
'use strict';
const certs = Array.isArray(window.CERTIFICATES) ? window.CERTIFICATES : [];
const FIELD_ORDER=['cyber','grc','cloud','dev','ai','it'];
const L={
 ar:{back:'← العودة للبورتفوليو',lang:'EN',eyebrow:'الدورات',title:'الدورات والتدريب',count:n=>`${n} دورة / ورشة`,note:'شهادات لورش ودورات تدريبية.',field:'المجال',sub:'تخصص الأمن السيبراني',issuer:'الجهة المانحة',all:'الكل',allIssuers:'كل الجهات',fields:{cyber:'الأمن السيبراني',grc:'الحوكمة والمخاطر',cloud:'الحوسبة السحابية',dev:'التطوير',ai:'الذكاء الاصطناعي',it:'تقنية المعلومات والتقنيات الناشئة'},subs:{blue:'الدفاع والتحليل (Blue Team)',offensive:'الاختراق وCTF',fundamentals:'الأساسيات'},view:'تكبير الشهادة',hours:h=>`${h} ساعة`,pro:'شهادة مهنية معتمدة',verify:'تحقق',types:{credential:'اعتماد بعد اختبار',training:'دورة تدريب',attendance:'حضور'},additional:'دورات إضافية',additionalNote:'دورات Doroob وEdraak مجمعة هنا لتبقى الصفحة الرئيسية والمجالات الأساسية مختصرة.'},
 en:{back:'← Back to portfolio',lang:'AR',eyebrow:'Courses',title:'Courses & Training',count:n=>`${n} courses / workshops`,note:'Certificates from workshops and training courses.',field:'Field',sub:'Cybersecurity specialization',issuer:'Issuer',all:'All',allIssuers:'All issuers',fields:{cyber:'Cybersecurity',grc:'Governance & Risk',cloud:'Cloud Computing',dev:'Development',ai:'Artificial Intelligence',it:'IT & Emerging Technologies'},subs:{blue:'Defense & Analysis (Blue Team)',offensive:'Offensive Security & CTF',fundamentals:'Fundamentals'},view:'Enlarge certificate',hours:h=>`${h}h`,pro:'Professional certification',verify:'Verify',types:{credential:'Exam-based credential',training:'Course / Training',attendance:'Attendance'},additional:'Additional Courses',additionalNote:'Doroob and Edraak courses are grouped here to keep the main categories concise.'}
};
const params=new URLSearchParams(location.search);const requestedCertId=params.get('cert');const fromSection=params.get('from')||'certifications';let lang=params.get('lang');if(lang!=='ar'&&lang!=='en'){try{lang=localStorage.getItem('portfolio-lang')}catch(_){}}if(lang!=='ar'&&lang!=='en')lang='en';
let activeField='all',activeSub='all',activeIssuer='all';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const t=v=>typeof v==='string'?v:(v?.[lang]??v?.en??v?.ar??'');
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=lang==='ar'?'الدورات والتدريب':'Courses & Training';try{localStorage.setItem('portfolio-lang',lang)}catch(_){}const c=L[lang];$('pageBack').textContent=c.back;$('langBtn').textContent=c.lang;$('heroEyebrow').textContent=c.eyebrow;$('heroTitle').textContent=c.title;$('heroCount').textContent=c.count(certs.length);$('classificationNote').textContent=c.note;$('fieldFilterLabel').textContent=c.field;$('subFilterLabel').textContent=c.sub;$('issuerFilterLabel').textContent=c.issuer;}
function sortItems(items){return [...items].sort((a,b)=>((a.priority??999)-(b.priority??999)) || ((b.date||'0000-00-00').localeCompare(a.date||'0000-00-00')));}
function matches(c){return (activeField==='all'||c.fields.includes(activeField))&&(activeSub==='all'||c.sub===activeSub)&&(activeIssuer==='all'||c.issuerKey===activeIssuer);}
function countField(key){return certs.filter(c=>c.fields.includes(key)).length}function countSub(key){return certs.filter(c=>c.sub===key).length}function countIssuer(key){return certs.filter(c=>c.issuerKey===key).length}
function renderFilters(){const c=L[lang];$('fieldFilters').innerHTML=`<button class="filter ${activeField==='all'?'active':''}" data-field="all" type="button">${esc(c.all)} (${certs.length})</button>`+FIELD_ORDER.map(k=>`<button class="filter ${activeField===k?'active':''}" data-field="${k}" type="button">${esc(c.fields[k])} (${countField(k)})</button>`).join('');const showSub=activeField==='cyber';$('subFilterGroup').hidden=!showSub;if(!showSub)activeSub='all';$('subFilters').innerHTML=`<button class="filter ${activeSub==='all'?'active':''}" data-sub="all" type="button">${esc(c.all)} (${countField('cyber')})</button>`+['blue','offensive','fundamentals'].map(k=>`<button class="filter ${activeSub===k?'active':''}" data-sub="${k}" type="button">${esc(c.subs[k])} (${countSub(k)})</button>`).join('');
 const issuers=[];for(const cert of certs){if(!issuers.some(x=>x.key===cert.issuerKey))issuers.push({key:cert.issuerKey,label:cert.issuer});}issuers.sort((a,b)=>a.label.localeCompare(b.label));const issuerButton=(key,label,count,active)=>`<button class="filter ${active?'active':''}" data-issuer="${esc(key)}" type="button"><span class="filter-name" dir="auto">${esc(label)}</span><span class="filter-count" dir="ltr">${count}</span></button>`;$('issuerFilters').innerHTML=issuerButton('all',c.allIssuers,certs.length,activeIssuer==='all')+issuers.map(x=>issuerButton(x.key,x.label,countIssuer(x.key),activeIssuer===x.key)).join('');}
function card(c){const details=[c.hours?L[lang].hours(c.hours):'',c.date||''].filter(Boolean).join(' · ');const note=c.note?`<span class="note">${esc(t(c.note))}</span>`:'';const partner=c.partner?`<p class="partner">${lang==='ar'?'بالتعاون مع: ':'In collaboration with: '}${esc(c.partner)}</p>`:'';const title=t(c.title);const type=c.type||'training';const typeLabel=L[lang].types[type]||type;return `<article class="card" data-id="${esc(c.id)}"><div class="thumb"><img src="assets/certificates/${esc(c.file)}" alt="${esc(title)}" loading="lazy" onerror="const c=this.closest('.card');this.closest('.thumb').remove();const b=c.querySelector('.open-cert');if(b)b.remove()"></div><div class="meta"><h3 dir="auto">${esc(title)}</h3><span class="cert-type cert-type--${esc(type)}">${esc(typeLabel)}</span><p class="issuer">${esc(c.issuer)}</p>${partner}<div class="details">${esc(details)}</div>${note}<button class="open-cert" type="button" data-id="${esc(c.id)}" data-src="assets/certificates/${esc(c.file)}" data-title="${esc(title)}">${esc(L[lang].view)}</button></div></article>`}
function titleFamilyKey(c){return String(c?.title?.en||'').toLowerCase().replace(/cyber\s+security/g,'cybersecurity').replace(/[^a-z0-9]/g,'')}
function mergedCourseRow(items){if(!items.length)return '';const first=items[0];const title=t(first.title);const type=first.type||'training';const typeLabel=L[lang].types[type]||type;return `<article class="merged-course-row" data-merged-title="${esc(titleFamilyKey(first))}"><div><h3 dir="auto">${esc(title)}</h3><span class="cert-type cert-type--${esc(type)}">${esc(typeLabel)}</span></div><div class="merged-cert-actions">${items.map(c=>`<button class="open-cert merged-cert-button" type="button" data-id="${esc(c.id)}" data-src="assets/certificates/${esc(c.file)}" data-title="${esc(t(c.title))}"><strong>${esc(c.issuer)}</strong><span>${esc([c.hours?L[lang].hours(c.hours):'',c.date||''].filter(Boolean).join(' · '))}</span></button>`).join('')}</div></article>`}
function renderList(){const filtered=sortItems(certs.filter(matches));if(activeField==='all'&&activeSub==='all'&&activeIssuer==='all'){const isAdditional=c=>c.issuerKey==='doroob'||c.issuerKey==='edraak';const introKey='introductiontocybersecurity';const introFamily=filtered.filter(c=>titleFamilyKey(c)===introKey);const additional=filtered.filter(c=>isAdditional(c)&&titleFamilyKey(c)!==introKey);const primary=filtered.filter(c=>!isAdditional(c)&&titleFamilyKey(c)!==introKey);const mainGroups=FIELD_ORDER.map(field=>{const items=sortItems(primary.filter(c=>c.field===field));return items.length?`<section class="field-group" data-field-group="${field}"><h2>${esc(L[lang].fields[field])} (${items.length})</h2><div class="grid">${items.map(card).join('')}</div></section>`:''}).join('');const extraCount=additional.length+introFamily.filter(isAdditional).length;const extra=extraCount?`<details class="additional-courses"><summary>${esc(L[lang].additional)} (${extraCount})</summary>${introFamily.length>1?mergedCourseRow(introFamily):''}<div class="grid">${additional.map(card).join('')}${introFamily.length===1?introFamily.map(card).join(''):''}</div><p class="additional-courses-note">${esc(L[lang].additionalNote)}</p></details>`:'';$('groups').innerHTML=mainGroups+extra;}else{$('groups').innerHTML=filtered.length?`<div class="grid">${filtered.map(card).join('')}</div>`:`<p class="empty">${lang==='ar'?'لا توجد نتائج مطابقة.':'No matching results.'}</p>`;}}
function renderPro(){const host=$('proCerts');const items=Array.isArray(window.PRO_CERTS)?window.PRO_CERTS:[];if(!items.length){host.replaceChildren();host.hidden=true;return}host.hidden=false;host.innerHTML=`<h2 class="pro-certs-title">${esc(L[lang].pro)}</h2><div class="pro-certs-list">${items.map(x=>{const visual=x.logo||x.image;const bits=[x.date?`<span>${esc(x.date)}</span>`:'',x.credentialId?`<span>${esc(x.credentialId)}</span>`:'',x.credentialUrl?`<a class="pro-cert-verify" href="${esc(x.credentialUrl)}" target="_blank" rel="noopener noreferrer">${esc(L[lang].verify)}</a>`:''].filter(Boolean).join(' · ');return `<article class="pro-cert-row">${visual?`<img src="${esc(visual)}" alt="">`:''}<div><strong>${esc(t(x.title))}</strong><span>${esc(x.issuer||'')}</span><small>${bits}</small></div></article>`}).join('')}</div>`}
function render(){applyLang();renderFilters();renderPro();renderList();bindFilters()}
function bindFilters(){document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{activeField=b.dataset.field;if(activeField!=='cyber')activeSub='all';render()});document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{activeSub=b.dataset.sub;render()});document.querySelectorAll('[data-issuer]').forEach(b=>b.onclick=()=>{activeIssuer=b.dataset.issuer;render()});}
function backToPortfolio(){const fallback=`index.html?lang=${lang}#${fromSection}`;try{if(document.referrer){const ref=new URL(document.referrer);if(/index\.html$/.test(ref.pathname)||ref.pathname==='/'||/portfolio-v4\.36/i.test(ref.pathname)){history.back();return;}}}catch(_){}location.href=fallback;}$('pageBack').onclick=backToPortfolio;$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';const u=new URL(location.href);u.searchParams.set('lang',lang);if(requestedCertId)u.searchParams.set('cert',requestedCertId);u.searchParams.set('from',fromSection);history.replaceState(null,'',u);render()};
let zoom=1,fitZoom=1,fitMode=true,lastFocus=null;const lb=$('certLightbox'),pv=$('preview'),scrollBox=document.querySelector('.cert-preview-scroll'),directPreview=Boolean(requestedCertId&&fromSection==='certifications');function availablePreviewSize(){const cs=getComputedStyle(scrollBox);const px=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);const py=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);return {width:Math.max(1,scrollBox.clientWidth-px),height:Math.max(1,scrollBox.clientHeight-py)}}function zoomAnchor(){return {x:scrollBox.scrollWidth>scrollBox.clientWidth?(scrollBox.scrollLeft+scrollBox.clientWidth/2)/scrollBox.scrollWidth:.5,y:scrollBox.scrollHeight>scrollBox.clientHeight?(scrollBox.scrollTop+scrollBox.clientHeight/2)/scrollBox.scrollHeight:.5}}function restoreZoomAnchor(a){requestAnimationFrame(()=>{const maxX=Math.max(0,scrollBox.scrollWidth-scrollBox.clientWidth),maxY=Math.max(0,scrollBox.scrollHeight-scrollBox.clientHeight);scrollBox.scrollLeft=Math.max(0,Math.min(maxX,a.x*scrollBox.scrollWidth-scrollBox.clientWidth/2));scrollBox.scrollTop=Math.max(0,Math.min(maxY,a.y*scrollBox.scrollHeight-scrollBox.clientHeight/2));})}function applyZoom(preserve=false){if(!pv.naturalWidth)return zoom;const anchor=preserve?zoomAnchor():null;pv.style.width=`${Math.max(1,Math.round(pv.naturalWidth*zoom))}px`;pv.style.height='auto';$('zoomReset').textContent=`${Math.round(100*zoom)}%`;if(anchor)restoreZoomAnchor(anchor);return zoom}function calculateFit(){if(!pv.naturalWidth||!pv.naturalHeight)return 1;const available=availablePreviewSize();return Math.min(1,available.width/pv.naturalWidth,available.height/pv.naturalHeight)}function fitPreview(){if(!pv.naturalWidth)return;fitZoom=calculateFit();zoom=fitZoom;fitMode=true;applyZoom(false);scrollBox.scrollTo({left:0,top:0});pv.style.visibility='visible'}function openPreview(button){if(!button)return;lastFocus=button;fitMode=true;pv.style.visibility='hidden';pv.style.width='auto';pv.src
