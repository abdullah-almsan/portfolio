<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Information Security Diploma Certificate</title><style>:root{--bg:#0b0c10;--surface:#11131a;--surface-2:#151821;--border:#252936;--text:#f4f5f7;--muted:#a2a8b5;--accent:#8b5cf6;--accent-soft:rgba(139,92,246,.12)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif}body{display:flex;flex-direction:column}.bar{min-height:58px;height:auto;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg)}.bar-start{display:flex;align-items:center;gap:10px;min-width:0}.portfolio-back{border:1px solid var(--border);background:var(--surface-2);color:var(--accent);border-radius:9px;padding:8px 11px;text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}.portfolio-back:hover,.portfolio-back:focus-visible{border-color:var(--accent);background:var(--accent-soft)}.tag{color:var(--accent);font-weight:700;font-size:13px}.zoom{display:flex;gap:6px}.zoom button{min-width:40px;height:38px;border:1px solid var(--border);background:var(--surface-2);color:var(--accent);border-radius:9px;padding:7px 10px;cursor:pointer;font:inherit;font-weight:700}.viewport{height:auto;flex:1;min-height:0;overflow:auto;padding:18px;direction:ltr}.sheet{width:max-content;min-width:100%;min-height:100%;display:block}.sheet img{display:block;flex:0 0 auto;width:auto;height:auto;max-width:none;background:white;border-radius:8px;user-select:none;-webkit-user-drag:none;box-shadow:0 14px 50px rgba(0,0,0,.5);margin-inline:auto}.rotate-hint{display:none;position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:12px;width:max-content;max-width:calc(100vw - 24px);padding:7px 10px;border:1px solid var(- </head><body class="recommendation-viewer-body" data-scroll-root oncontextmenu="return false"><div class="bar"><div class="bar-start"><a class="portfolio-back" id="portfolioBack" href="../index.html">← العودة للبورتفوليو</a><div class="tag" id="viewTag">للاطلاع فقط</div></div><div class="zoom"><button id="minus" type="button" aria-label="Zoom out">−</button><button id="fit" type="button" aria-label="Fit">Fit</button><button id="plus" type="button" aria-label="Zoom in">+</button><button id="fullscreen" type="button" aria-label="Open fullscreen">⛶ <span id="fullscreenLabel">ملء الشاشة</span></button></div></div><div class="rotate-hint" id="rotateHint">أدر الجهاز للقراءة</div><div class="viewport" id="vp" data-scroll-root><div class="sheet"><img id="certificate" src="../assets/education/psau-diploma-certificate-public.png" alt="Information Security Diploma certificate - student ID redacted" draggable="false"></div></div><script>const requestedLang=new URLSearchParams(location.search).get('lang');let siteLang=requestedLang==='en'?'en':requestedLang==='ar'?'ar':'ar';if(requestedLang!=='en'&&requestedLang!=='ar'){try{siteLang=parent.document.documentElement.lang==='en'?'en':'ar'}catch(_){}}document.documentElement.lang=siteLang;document.documentElement.dir=siteLang==='ar'?'rtl':'ltr';const tag=document.getElementById('viewTag');tag.textContent=siteLang==='ar'?'للاطلاع فقط':'View only';const back=document.getElementById('portfolioBack');back.textContent=siteLang==='ar'?'← العودة للبورتفوليو':'← Back to portfolio';back.addEventListener('click',e=>{e.preventDefault();try{sessionStorage.setItem('portfolio-restore-scroll','1')}catch(_){}location.href='../index.html';});const im=document.getElementById('certificate'),vp=document.getElementById('vp'),fitBtn=document.getElementById('fit'),fs=document.getElementById('fullscreen'),fsLabel=document.getElementById('fullscreenLabel'),rotateHint=document.getElementById('rotateHint');if(fsLabel)fsLabel.textContent=siteLang==='ar'?'ملء الشاشة':'Fullscreen';if(fs)fs.setAttribute('aria-label',siteLang==='ar'?'فتح بملء الشاشة':'Open fullscreen');if(rotateHint)rotateHint.textContent=siteLang==='ar'?'أدر الجهاز للقراءة':'Rotate device for easier reading';let z=1,fitMode=true;function zoomAnchor(){return {x:vp.scrollWidth>vp.clientWidth?(vp.scrollLeft+vp.clientWidth/2)/vp.scrollWidth:.5,y:vp.scrollHeight>vp.clientHeight?(vp.scrollTop+vp.clientHeight/2)/vp.scrollHeight:.5}}function restoreZoomAnchor(a){requestAnimationFrame(()=>{const maxX=Math.max(0,vp.scrollWidth-vp.clientWidth),maxY=Math.max(0,vp.scrollHeight-vp.clientHeight);vp.scrollLeft=Math.max(0,Math.min(maxX,a.x*vp.scrollWidth-vp.clientWidth/2));vp.scrollTop=Math.max(0,Math.min(maxY,a.y*vp.scrollHeight-vp.clientHeight/2));})}function apply(preserve=false){const anchor=preserve?zoomAnchor():null,nw=im.naturalWidth||1600;im.style.width=Math.max(1,Math.round(nw*z))+'px';im.style.height='auto';fitBtn.textContent=Math.round(z*100)+'%';if(anchor)restoreZoomAnchor(anchor);return z}function availableSize(){const cs=getComputedStyle(vp);return {w:Math.max(1,vp.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0)),h:Math.max(1,vp.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0))}}function fit(){const nw=im.naturalWidth||1600,nh=im.naturalHeight||1100,a=availableSize();z=vp.clientWidth<600?Math.min(1,a.w/nw):Math.min(1,a.w/nw,a.h/nh);fitMode=true;apply();vp.scrollTo(0,0);return z}window.portfolioViewerSetZoom=v=>{fitMode=false;z=Math.max(.05,Math.min(2,Number(v)||1));return apply(true)};document.getElementById('plus').onclick=()=>{fitMode=false;z=Math.min(2,z+.08);apply(true)};document.getElementById('minus').onclick=()=>{fitMode=false;z=Math.max(.05,z-.08);apply(true)};fitBtn.onclick=fit;function toggleFullscreen(){const active=document.fullscreenElement||document.webkitFullscreenElement,root=document.documentElement;if(active){const fn=document.exitFullscreen||document.webkitExitFullscreen;if(fn)try{return fn.call(document)}catch(_){return false}}else{const fn=root.requestFullscreen||root.webkitRequestFullscreen;if(fn)try{return fn.call(root)}catch(_){return false}}return false}if(fs)fs.onclick=toggleFullscreen;im.addEventListener('load',fit);window.addEventListener('resize',()=>{if(fitMode)fit()});window.addEventListener('orientationchange',()=>{if(fitMode)fit()});if(im.complete)fit();</script></body></html>
