<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Image Viewer</title>
<style>
:root{--bg:#080d12;--surface:#0d141b;--surface-2:#111b24;--line:#22313d;--text:#e6eef3;--accent:#35d6ff}
*{box-sizing:border-box;min-width:0}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}body{display:flex;flex-direction:column}
.bar{min-height:54px;flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar button{height:38px;min-width:42px;border:1px solid var(--line);background:var(--surface-2);color:var(--accent);border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.viewer-scroll{height:auto;flex:1;min-height:0;overflow:auto;padding:18px;direction:ltr}.sheet{width:max-content;min-width:100%;display:block}.sheet img{display:block;flex:0 0 auto;width:min(100%,1500px);height:auto;max-width:none;background:#fff;box-shadow:0 12px 42px rgba(0,0,0,.55);transform-origin:top center;user-select:none;-webkit-user-drag:none;margin-inline:auto}
@media(max-width:520px){.viewer-scroll{padding:9px}.bar{padding-inline:9px;flex-wrap:wrap}.bar button{min-height:44px}.bar #fullscreen{padding-inline:10px}}
</style><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared-theme.css"><script src="shared-bidi.js" defer></script>
<link rel="icon" type="image/svg+xml" href="../assets/ui/logo.svg">
</head><body class="image-viewer-body" data-scroll-root><div class="bar"><button id="minus">−</button><button id="fit">100%</button><button id="plus">+</button><button id="fullscreen" type="button">⛶ <span id="fullscreenLabel">ملء الشاشة</span></button></div><div class="viewer-scroll" id="scroll" data-scroll-root><div class="sheet"><img id="img" alt="Document" draggable="false"></div></div>
<script>const q=new URLSearchParams(location.search);let src=q.get('src')||'';if(src.startsWith('assets/'))src='../'+src;let uiLang=q.get('lang')==='en'?'en':q.get('lang')==='ar'?'ar':'ar';if(!q.get('lang')){try{const stored=localStorage.getItem('portfolio-lang');if(stored==='en'||stored==='ar')uiLang=stored;else uiLang=parent.document.documentElement.lang==='en'?'en':'ar'}catch(_){}}document.documentElement.lang=uiLang;document.documentElement.dir=uiLang==='ar'?'rtl':'ltr';const im=document.getElementById('img'),fit=document.getElementById('fit'),scroll=document.getElementById('scroll'),fs=document.getElementById('fullscreen'),fsLabel=document.getElementById('fullscreenLabel');if(fsLabel)fsLabel.textContent=uiLang==='ar'?'ملء الشاشة':'Fullscreen';if(fs)fs.setAttribute('aria-label',uiLang==='ar'?'فتح بملء الشاشة':'Open fullscreen');let z=1,fitMode=true;function zoomAnchor(){return {x:scroll.scrollWidth>scroll.clientWidth?(scroll.scrollLeft+scroll.clientWidth/2)/scroll.scrollWidth:.5,y:scroll.scrollHeight>scroll.clientHeight?(scroll.scrollTop+scroll.clientHeight/2)/scroll.scrollHeight:.5}}function restoreZoomAnchor(a){requestAnimationFrame(()=>{const maxX=Math.max(0,scroll.scrollWidth-scroll.clientWidth),maxY=Math.max(0,scroll.scrollHeight-scroll.clientHeight);scroll.scrollLeft=Math.max(0,Math.min(maxX,a.x*scroll.scrollWidth-scroll.clientWidth/2));scroll.scrollTop=Math.max(0,Math.min(maxY,a.y*scroll.scrollHeight-scroll.clientHeight/2));})}function apply(preserve=false){const anchor=preserve?zoomAnchor():null,nw=im.naturalWidth||1500;im.style.width=Math.max(1,Math.round(nw*z))+'px';im.style.height='auto';fit.textContent=Math.round(z*100)+'%';if(anchor)restoreZoomAnchor(anchor);return z}function availableWidth(){const cs=getComputedStyle(scroll);return Math.max(1,scroll.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0))}function fitImage(){const nw=im.naturalWidth||1500,nh=im.naturalHeight||1000,w=availableWidth(),cs=getComputedStyle(scroll),h=Math.max(1,scroll.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0));z=scroll.clientWidth<600?Math.min(1,w/nw):Math.min(1,w/nw,h/nh);fitMode=true;apply();scroll.scrollTo(0,0);return z}window.portfolioViewerSetZoom=v=>{fitMode=false;z=Math.max(.05,Math.min(2,Number(v)||1));return apply(true)};document.getElementById('plus').onclick=()=>{fitMode=false;z=Math.min(2,z+.08);apply(true)};document.getElementById('minus').onclick=()=>{fitMode=false;z=Math.max(.05,z-.08);apply(true)};fit.onclick=fitImage;function toggleFullscreen(){const active=document.fullscreenElement||document.webkitFullscreenElement,root=document.documentElement;if(active){const fn=document.exitFullscreen||document.webkitExitFullscreen;if(fn)try{return fn.call(document)}catch(_){return false}}else{const fn=root.requestFullscreen||root.webkitRequestFullscreen;if(fn)try{return fn.call(root)}catch(_){return false}}return false}if(fs)fs.onclick=toggleFullscreen;im.addEventListener('load',fitImage);window.addEventListener('resize',()=>{if(fitMode)fitImage()});window.addEventListener('orientationchange',()=>{if(fitMode)fitImage()});im.src=src;</script></body></html>
